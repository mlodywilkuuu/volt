<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #phone-frame { width: 320px; height: 600px; background: #000; border-radius: 40px; position: relative; overflow: hidden; border: 8px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .screen { position: absolute; width: 100%; height: 100%; display: none; transition: 0.3s; }
        .active { display: block; }
        
        /* Styl iOS */
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; color: white; padding: 15px; margin: 10px; }
        
        /* Powiadomienie */
        #notification-box { position: absolute; top: -100px; width: 280px; left: 10px; transition: 0.5s; z-index: 10; }
        .show-notif { top: 40px !important; }
    </style>
</head>
<body>

<div id="phone-frame">
    <div id="lock-screen" class="screen active" style="background: linear-gradient(to bottom, #5f2c82, #49a09d);">
        <h1 style="text-align: center; margin-top: 150px; font-size: 3em;">10:30</h1>
        <div style="text-align: center; cursor: pointer;" onclick="showScreen('home-screen')">Przesuń, aby odblokować</div>
    </div>

    <div id="home-screen" class="screen" style="background: #000;">
        <div class="glass" onclick="triggerNotification()">Kliknij, aby przetestować powiadomienie</div>
    </div>

    <div id="notification-box" class="glass">
        <strong>Domestos OS</strong><br>
        Nowa wiadomość: System gotowy do pracy!
    </div>
</div>

<script>
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function triggerNotification() {
        const n = document.getElementById('notification-box');
        n.classList.add('show-notif');
        setTimeout(() => n.classList.remove('show-notif'), 3000);
    }
</script>

</body>
</html>
