<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt | Wkrótce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..0,900;1,100..0,900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Płynna animacja gradientu w tle */
        @keyframes gradient-move {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #090d16, #0f172a, #1e1b4b, #0891b2, #020617);
            background-size: 300% 300%;
            animation: gradient-move 15s ease infinite;
        }

        /* Zaawansowany efekt szkła (Glassmorphism) */
        .glass-box {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Stylizacja czcionki nagłówka */
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
        }

        /* Delikatne pulsowanie neonu */
        @keyframes neon-pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.6)); opacity: 0.95; }
            50% { filter: drop-shadow(0 0 30px rgba(6, 182, 212, 0.9)); opacity: 1; }
        }
        .neon-text {
            animation: neon-pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="animated-bg h-screen w-screen flex items-center justify-center p-4 overflow-hidden selection:bg-cyan-500 selection:text-white">

    <div class="glass-box w-full max-w-2xl rounded-3xl p-12 md:p-20 text-center relative overflow-hidden transition-all duration-500 hover:scale-[1.01]">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/15 rounded-full blur-3xl pointer-events-none"></div>

        <div class="inline-flex items-center gap-2 bg-cyan-500/10 border border-cyan-500/20 px-4 py-1.5 rounded-full text-xs font-semibold text-cyan-400 uppercase tracking-widest mb-8 select-none">
            ⚡ Volt Project
        </div>

        <h1 class="font-cyber neon-text text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-300 to-blue-500 tracking-widest uppercase">
            Wkrótce
        </h1>

        <p class="text-slate-400 font-medium text-sm md:text-base mt-6 max-w-md mx-auto leading-relaxed font-sans">
            Prace nad platformą trwają. Szykujcie się na nową jakość komunikacji w czasie rzeczywistym.
        </p>
    </div>

</body>
</html>
